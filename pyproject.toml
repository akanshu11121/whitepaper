[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-implementation-lab"
version = "0.1.0"
description = "Traceable paper-to-product implementations and interactive experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.8,<3", "numpy>=2,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "pyyaml>=6,<7",
  "safetensors>=0.5,<1", "psutil>=6,<8", "sacrebleu>=2.5,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-psutil", "pytest-cov>=6,<8", "pip-audit>=2.9,<3"]

[project.scripts]
research-lab = "research_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
files = ["src/research_lab"]
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
